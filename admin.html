<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Noura Bites</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8 antialiased">

  <div class="max-w-4xl mx-auto">
    <!-- Header Admin -->
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-8 bg-white p-5 rounded-2xl shadow-sm">
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-gray-900">🛠️ Admin Noura Bites Snack</h1>
        <p class="text-xs text-gray-500 mt-0.5">Kelola katalog produk & foto (Cloudinary)</p>
      </div>
      <a href="<?= webAppUrl ?>" target="_top" class="inline-flex items-center justify-center bg-amber-100 hover:bg-amber-200 text-amber-800 text-sm font-semibold px-4 py-2 rounded-xl transition">
        ← Lihat Halaman Toko
      </a>
    </div>

    <!-- Form Tambah / Edit Produk -->
    <div class="bg-white p-6 rounded-2xl shadow-md mb-8">
      <div class="flex justify-between items-center border-b pb-3 mb-5">
        <h2 id="formTitle" class="text-lg font-bold text-gray-800">Tambah Produk Baru</h2>
        <button type="button" id="btnCancelEdit" onclick="resetForm()" class="hidden text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded-lg font-semibold">
          Batal Edit
        </button>
      </div>

      <form id="productForm" class="space-y-4">
        <input type="hidden" id="editId" value="">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">Password Admin *</label>
            <input type="password" id="adminPass" required placeholder="Default: admin123" class="w-full px-3.5 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Nama Produk *</label>
            <input type="text" id="namaProduk" required placeholder="Contoh: Basreng Daun Jeruk" class="w-full px-3.5 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">Harga (Angka saja) *</label>
            <input type="number" id="hargaProduk" required placeholder="Contoh: 15000" class="w-full px-3.5 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Foto Produk <span id="fotoNote" class="text-red-500">*</span></label>
            <input type="file" id="fotoProduk" accept="image/*" required class="w-full px-3 py-1.5 border rounded-xl bg-gray-50 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Deskripsi Singkat *</label>
          <textarea id="deskripsiProduk" rows="2" required placeholder="Jelaskan rasa, berat bersih, kemasan, dll..." class="w-full px-3.5 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
        </div>

        <button type="submit" id="btnSave" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-6 py-2.5 rounded-xl shadow transition">
          Upload & Simpan Produk
        </button>
      </form>
    </div>

    <!-- Daftar Produk Aktif -->
    <div class="bg-white p-6 rounded-2xl shadow-md">
      <h2 class="text-lg font-bold mb-4 border-b pb-3 text-gray-800">Daftar Produk Saat Ini</h2>
      <div id="admin-product-list" class="divide-y">
        <p class="text-gray-500 py-4 text-sm">Memuat data produk...</p>
      </div>
    </div>
  </div>

  <script>
    // KONFIGURASI CLOUDINARY ANDA
    const CLOUDINARY_CLOUD_NAME = 'YOUR_CLOUD_NAME'; // Ganti dengan Cloud Name Anda
    const CLOUDINARY_UPLOAD_PRESET = 'YOUR_UPLOAD_PRESET'; // Ganti dengan Unsigned Upload Preset Anda

    let currentProducts = [];

    document.addEventListener('DOMContentLoaded', loadProducts);

    function loadProducts() {
      google.script.run
        .withSuccessHandler(renderAdminProducts)
        .withFailureHandler(function(err) {
          document.getElementById('admin-product-list').innerHTML = 
            '<p class="text-red-600 py-4 text-sm">Error: ' + err.message + '</p>';
        })
        .getProducts();
    }

    function renderAdminProducts(products) {
      currentProducts = products || [];
      const container = document.getElementById('admin-product-list');
      
      if (currentProducts.length === 0) {
        container.innerHTML = '<p class="text-gray-500 py-4 text-sm">Belum ada produk yang tersimpan.</p>';
        return;
      }

      container.innerHTML = '';
      currentProducts.forEach((p, idx) => {
        const imgUrl = p.gambar && p.gambar.startsWith('http') 
          ? p.gambar 
          : 'https://placehold.co/150x150/f59e0b/ffffff?text=Snack';

        const item = document.createElement('div');
        item.className = 'py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4';
        item.innerHTML = `
          <div class="flex items-center gap-4">
            <img src="${imgUrl}" class="w-16 h-16 object-cover rounded-xl border bg-gray-50">
            <div>
              <h3 class="font-bold text-gray-900">${p.nama}</h3>
              <p class="text-sm text-amber-600 font-semibold">Rp ${Number(p.harga).toLocaleString('id-ID')}</p>
              <p class="text-xs text-gray-500 mt-0.5">${p.deskripsi}</p>
            </div>
          </div>
          <div class="flex gap-2">
            <button type="button" onclick="editProduk(${idx})" class="bg-blue-100 hover:bg-blue-600 hover:text-white text-blue-700 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
              Edit
            </button>
            <button type="button" onclick="hapusProduk('${p.id}')" class="bg-red-100 hover:bg-red-600 hover:text-white text-red-700 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
              Hapus
            </button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function editProduk(idx) {
      const p = currentProducts[idx];
      document.getElementById('editId').value = p.id;
      document.getElementById('namaProduk').value = p.nama;
      document.getElementById('hargaProduk').value = p.harga;
      document.getElementById('deskripsiProduk').value = p.deskripsi;
      
      document.getElementById('formTitle').innerText = 'Edit Produk: ' + p.nama;
      document.getElementById('btnSave').innerText = 'Simpan Perubahan';
      document.getElementById('btnCancelEdit').classList.remove('hidden');
      
      document.getElementById('fotoProduk').required = false;
      document.getElementById('fotoNote').innerText = '(Kosongkan jika tidak ganti foto)';
      document.getElementById('fotoNote').className = 'text-gray-400 text-xs font-normal';
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('productForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('formTitle').innerText = 'Tambah Produk Baru';
      document.getElementById('btnSave').innerText = 'Upload & Simpan Produk';
      document.getElementById('btnCancelEdit').classList.add('hidden');
      
      document.getElementById('fotoProduk').required = true;
      document.getElementById('fotoNote').innerText = '*';
      document.getElementById('fotoNote').className = 'text-red-500';
    }

    async function uploadToCloudinary(file) {
      if (CLOUDINARY_CLOUD_NAME === 'YOUR_CLOUD_NAME' || CLOUDINARY_UPLOAD_PRESET === 'YOUR_UPLOAD_PRESET') {
        throw new Error('Anda belum mengisi CLOUDINARY_CLOUD_NAME dan CLOUDINARY_UPLOAD_PRESET di kode admin.html!');
      }

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await response.json();
      if (!data.secure_url) {
        throw new Error(data.error ? data.error.message : 'Gagal upload ke Cloudinary.');
      }
      return data.secure_url;
    }

    document.getElementById('productForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSave');
      const fileInput = document.getElementById('fotoProduk');
      const password = document.getElementById('adminPass').value;
      const editId = document.getElementById('editId').value;

      btn.disabled = true;

      try {
        let imageUrl = '';
        if (fileInput.files.length > 0) {
          btn.innerText = 'Mengupload gambar...';
          imageUrl = await uploadToCloudinary(fileInput.files[0]);
        }

        btn.innerText = 'Menyimpan ke database...';
        const productData = {
          id: editId,
          nama: document.getElementById('namaProduk').value,
          harga: document.getElementById('hargaProduk').value,
          deskripsi: document.getElementById('deskripsiProduk').value,
          gambar: imageUrl
        };

        const handler = function(res) {
          alert(res.message);
          if (res.status === 'success') {
            resetForm();
            loadProducts();
          }
          btn.disabled = false;
          btn.innerText = editId ? 'Simpan Perubahan' : 'Upload & Simpan Produk';
        };

        if (editId) {
          google.script.run.withSuccessHandler(handler).updateProduct(productData, password);
        } else {
          google.script.run.withSuccessHandler(handler).addProduct(productData, password);
        }

      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
        btn.innerText = editId ? 'Simpan Perubahan' : 'Upload & Simpan Produk';
      }
    });

    function hapusProduk(id) {
      const pass = prompt('Masukkan Password Admin untuk menghapus produk:');
      if (!pass) return;

      google.script.run.withSuccessHandler(function(res) {
        alert(res.message);
        if (res.status === 'success') loadProducts();
      }).deleteProduct(id, pass);
    }
  </script>
</body>
</html>
