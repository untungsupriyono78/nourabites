<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Panel - Noura Bites</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8 antialiased">

  <div class="max-w-4xl mx-auto">
    <!-- Header Admin -->
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-8 bg-white p-5 rounded-2xl shadow-sm">
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-gray-900">🛠️ Admin Noura Bites Snack</h1>
        <p class="text-xs text-gray-500 mt-0.5">Kelola katalog produk & foto (Cloudinary Signed API)</p>
      </div>
      <a href="index.html" class="inline-flex items-center justify-center bg-amber-100 hover:bg-amber-200 text-amber-800 text-sm font-semibold px-4 py-2 rounded-xl transition">
        ← Lihat Halaman Toko
      </a>
    </div>

    <!-- Form Tambah / Edit Produk -->
    <div class="bg-white p-6 rounded-2xl shadow-md mb-8">
      <div class="flex justify-between items-center border-b pb-3 mb-5">
        <h2 id="formTitle" class="text-lg font-bold text-gray-800">Tambah Produk Baru</h2>
        <button type="button" id="btnCancelEdit" onclick="resetForm()" class="hidden text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded-lg font-semibold">
          Batal Edit
        </button>
      </div>

      <div id="alertBox" class="hidden mb-4 p-3.5 rounded-xl text-sm font-medium"></div>

      <form id="productForm" class="space-y-4">
        <input type="hidden" id="editId" value="">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="adminPass" class="block text-sm font-semibold mb-1">Password Admin *</label>
            <input type="password" id="adminPass" required autocomplete="current-password" placeholder="Masukkan password admin" class="w-full px-3.5 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>
          <div>
            <label for="namaProduk" class="block text-sm font-semibold mb-1">Nama Produk *</label>
            <input type="text" id="namaProduk" required maxlength="100" placeholder="Contoh: Basreng Daun Jeruk" class="w-full px-3.5 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="hargaProduk" class="block text-sm font-semibold mb-1">Harga (Angka saja) *</label>
            <input type="number" id="hargaProduk" required min="1" step="1" placeholder="Contoh: 15000" class="w-full px-3.5 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
          </div>
          <div>
            <label for="fotoProduk" class="block text-sm font-semibold mb-1">Foto Produk <span id="fotoNote" class="text-red-500">*</span></label>
            <input type="file" id="fotoProduk" accept="image/*" required class="w-full px-3 py-1.5 border rounded-xl bg-gray-50 text-sm">
          </div>
        </div>

        <div>
          <label for="deskripsiProduk" class="block text-sm font-semibold mb-1">Deskripsi Singkat *</label>
          <textarea id="deskripsiProduk" rows="2" required maxlength="500" placeholder="Jelaskan rasa, berat bersih, kemasan, dll..." class="w-full px-3.5 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
        </div>

        <button type="submit" id="btnSave" class="bg-amber-600 hover:bg-amber-700 disabled:opacity-60 text-white font-bold px-6 py-2.5 rounded-xl shadow transition">
          Upload & Simpan Produk
        </button>
      </form>
    </div>

    <!-- Daftar Produk Aktif -->
    <div class="bg-white p-6 rounded-2xl shadow-md">
      <h2 class="text-lg font-bold mb-4 border-b pb-3 text-gray-800">Daftar Produk Saat Ini</h2>
      <div id="admin-product-list" class="divide-y">
        <p class="text-gray-500 py-4 text-sm">Memuat data produk...</p>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyh-7oAUz82wSalbJKNsTQzFVJUqQMQ-mkXr6KtWeLAo6STEFewEqDX-XIRAICMavVLFQ/exec';
    let currentProducts = [];

    document.addEventListener('DOMContentLoaded', loadProducts);

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function showAlert(msg, isError) {
      const box = document.getElementById('alertBox');
      box.innerText = msg || (isError ? 'Terjadi kesalahan.' : 'Berhasil.');
      box.className = isError
        ? 'mb-4 p-3.5 rounded-xl text-sm font-medium bg-red-100 text-red-700 border border-red-200'
        : 'mb-4 p-3.5 rounded-xl text-sm font-medium bg-green-100 text-green-700 border border-green-200';
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function loadProducts() {
      try {
        const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
        const json = await res.json();
        if (json.status !== 'success') throw new Error(json.message);
        renderAdminProducts(json.data);
      } catch (err) {
        document.getElementById('admin-product-list').innerHTML =
          '<p class="text-red-600 py-4 text-sm">Error: ' + escapeHtml(err.message) + '</p>';
      }
    }

    function renderAdminProducts(products) {
      currentProducts = products || [];
      const container = document.getElementById('admin-product-list');

      if (currentProducts.length === 0) {
        container.innerHTML = '<p class="text-gray-500 py-4 text-sm">Belum ada produk yang tersimpan.</p>';
        return;
      }

      container.innerHTML = '';
      currentProducts.forEach(function (p, idx) {
        const fallback = 'https://placehold.co/150x150/f59e0b/ffffff?text=Snack';
        const imgUrl = p.gambar && p.gambar.startsWith('http') ? p.gambar : fallback;

        const item = document.createElement('div');
        item.className = 'py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4';
        item.innerHTML = `
          <div class="flex items-center gap-4">
            <img src="${escapeHtml(imgUrl)}" alt="" class="w-16 h-16 object-cover rounded-xl border bg-gray-50 shrink-0" onerror="this.onerror=null;this.src='${fallback}'">
            <div>
              <h3 class="font-bold text-gray-900">${escapeHtml(p.nama)}</h3>
              <p class="text-sm text-amber-600 font-semibold">Rp ${(Number(p.harga) || 0).toLocaleString('id-ID')}</p>
              <p class="text-xs text-gray-500 mt-0.5">${escapeHtml(p.deskripsi)}</p>
            </div>
          </div>
          <div class="flex gap-2 shrink-0">
            <button type="button" onclick="editProduk(${idx})" class="bg-blue-100 hover:bg-blue-600 hover:text-white text-blue-700 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
              Edit
            </button>
            <button type="button" onclick="hapusProduk(${idx}, this)" class="bg-red-100 hover:bg-red-600 hover:text-white disabled:opacity-60 text-red-700 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
              Hapus
            </button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function editProduk(idx) {
      const p = currentProducts[idx];
      if (!p) return;

      document.getElementById('editId').value = p.id;
      document.getElementById('namaProduk').value = p.nama;
      document.getElementById('hargaProduk').value = p.harga;
      document.getElementById('deskripsiProduk').value = p.deskripsi;
      document.getElementById('fotoProduk').value = '';

      document.getElementById('formTitle').innerText = 'Edit Produk: ' + p.nama;
      document.getElementById('btnSave').innerText = 'Simpan Perubahan';
      document.getElementById('btnCancelEdit').classList.remove('hidden');

      document.getElementById('fotoProduk').required = false;
      document.getElementById('fotoNote').innerText = '(Kosongkan jika tidak ganti foto)';
      document.getElementById('fotoNote').className = 'text-gray-400 text-xs font-normal';
      document.getElementById('alertBox').classList.add('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      // Password dipertahankan supaya tidak perlu diketik ulang setiap kali simpan
      const savedPass = document.getElementById('adminPass').value;
      document.getElementById('productForm').reset();
      document.getElementById('adminPass').value = savedPass;

      document.getElementById('editId').value = '';
      document.getElementById('formTitle').innerText = 'Tambah Produk Baru';
      document.getElementById('btnSave').innerText = 'Upload & Simpan Produk';
      document.getElementById('btnCancelEdit').classList.add('hidden');

      document.getElementById('fotoProduk').required = true;
      document.getElementById('fotoNote').innerText = '*';
      document.getElementById('fotoNote').className = 'text-red-500';
    }

    // Perkecil foto (maks. 800px) lalu ubah ke base64 JPEG
    function compressImageToBase64(file) {
      return new Promise(function (resolve, reject) {
        if (!file.type.startsWith('image/')) {
          reject(new Error('File yang dipilih bukan gambar.'));
          return;
        }
        const reader = new FileReader();
        reader.onload = function (event) {
          const img = new Image();
          img.onload = function () {
            const maxDim = 800;
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const width = Math.round(img.width * scale);
            const height = Math.round(img.height * scale);

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            // Latar putih agar PNG transparan tidak menjadi hitam saat dijadikan JPEG
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.onerror = function () { reject(new Error('File gambar tidak valid atau formatnya tidak didukung browser.')); };
          img.src = event.target.result;
        };
        reader.onerror = function () { reject(new Error('Gagal membaca file gambar.')); };
        reader.readAsDataURL(file);
      });
    }

    async function postToAppsScript(payload) {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    document.getElementById('productForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('btnSave');
      const fileInput = document.getElementById('fotoProduk');
      const password = document.getElementById('adminPass').value;
      const editId = document.getElementById('editId').value;

      btn.disabled = true;
      document.getElementById('alertBox').classList.add('hidden');

      try {
        let base64Image = '';
        if (fileInput.files.length > 0) {
          btn.innerText = 'Memproses gambar...';
          base64Image = await compressImageToBase64(fileInput.files[0]);
        }

        btn.innerText = base64Image ? 'Mengupload ke Cloudinary & menyimpan...' : 'Menyimpan...';
        const res = await postToAppsScript({
          action: editId ? 'editExistingProduct' : 'saveNewProduct',
          productData: {
            id: editId,
            nama: document.getElementById('namaProduk').value.trim(),
            harga: document.getElementById('hargaProduk').value,
            deskripsi: document.getElementById('deskripsiProduk').value.trim()
          },
          base64Image: base64Image,
          password: password
        });

        if (res.status === 'success') {
          resetForm();
          showAlert(res.message, false);
          loadProducts();
        } else {
          showAlert(res.message, true);
        }
      } catch (err) {
        showAlert('Error: ' + err.message, true);
      } finally {
        btn.disabled = false;
        // Teks tombol mengikuti keadaan form SEKARANG (sudah di-reset atau masih mode edit)
        btn.innerText = document.getElementById('editId').value ? 'Simpan Perubahan' : 'Upload & Simpan Produk';
      }
    });

    async function hapusProduk(idx, btn) {
      const p = currentProducts[idx];
      if (!p) return;

      // Pakai password di form bila sudah diisi; kalau belum, baru ditanyakan
      let pass = document.getElementById('adminPass').value;
      if (pass) {
        if (!confirm('Hapus produk "' + p.nama + '"? Tindakan ini tidak bisa dibatalkan.')) return;
      } else {
        pass = prompt('Masukkan Password Admin untuk menghapus "' + p.nama + '":');
        if (!pass) return;
      }

      if (btn) { btn.disabled = true; btn.innerText = 'Menghapus...'; }
      try {
        const res = await postToAppsScript({ action: 'deleteProduct', id: p.id, password: pass });
        showAlert(res.message, res.status !== 'success');
        if (res.status === 'success') {
          if (document.getElementById('editId').value === p.id) resetForm();
          await loadProducts();
          return;
        }
      } catch (err) {
        showAlert('Error: ' + err.message, true);
      }
      if (btn) { btn.disabled = false; btn.innerText = 'Hapus'; }
    }
  </script>
</body>
</html>
